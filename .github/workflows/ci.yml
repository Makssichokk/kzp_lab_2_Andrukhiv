name: CI

on:
  push:
    branches: [main, lab2]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, test and analyse
        run: mvn --batch-mode clean verify

      - name: Check version
        run: java -jar target/katalog-knyzhok-2.0.0.jar --version

      - name: Upload JAR
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: katalog-knyzhok-jar
          path: |
            target/katalog-knyzhok-*.jar
            !target/original-*.jar
